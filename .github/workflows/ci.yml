name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check studybuddy tests scripts tasks.py
      - run: pytest -q   # runs without a key: the app falls back to demo mode
      - run: docker build -t study-buddy .
