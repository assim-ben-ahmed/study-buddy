<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Study Buddy - Your Personal Tutor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>🎓 AI Study Buddy</h1>
        <p>Your personal AI tutor: understand, practise, remember.</p>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="chat" role="tab">💬 Tutor</button>
      <button class="tab" data-tab="quiz" role="tab">📝 Quiz</button>
      <button class="tab" data-tab="cards" role="tab">🃏 Flashcards</button>
      <label class="level">Level
        <select id="level">
          <option value="middle">Middle school</option>
          <option value="high" selected>High school</option>
          <option value="university">University</option>
        </select>
      </label>
    </nav>

    <!-- Tutor -->
    <section class="panel" id="panel-chat">
      <div class="modes">
        <button class="mode active" data-mode="explain" title="Explain a concept simply">💡 Explain</button>
        <button class="mode" data-mode="homework" title="Guided step by step, without just giving the answer">✍️ Homework coach</button>
        <button class="mode" data-mode="summarize" title="Summarize a topic or your notes">📄 Summarize</button>
        <button class="mode" data-mode="plan" title="Plan your revision">🎯 Study plan</button>
        <button class="clear" id="clear" title="Start a new conversation">↺ New chat</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Ask anything, or paste your notes… (Shift+Enter for a new line)"></textarea>
        <button type="submit" class="send" aria-label="Send">➤</button>
      </form>
    </section>

    <!-- Quiz -->
    <section class="panel" id="panel-quiz" hidden>
      <form class="generator" id="quiz-form">
        <textarea id="quiz-topic" rows="3" maxlength="6000" placeholder="Topic or notes to be quizzed on (e.g. 'The French Revolution' or paste your course notes)"></textarea>
        <div class="row">
          <label>Questions <select id="quiz-count"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label>
          <label>Difficulty <select id="quiz-difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
          <button type="submit" class="primary">📝 Generate quiz</button>
        </div>
      </form>
      <div id="quiz-area" class="scroll"></div>
    </section>

    <!-- Flashcards -->
    <section class="panel" id="panel-cards" hidden>
      <form class="generator" id="cards-form">
        <textarea id="cards-topic" rows="3" maxlength="6000" placeholder="Topic or notes to turn into flashcards"></textarea>
        <div class="row">
          <label>Cards <select id="cards-count"><option value="3">6</option><option value="5" selected>8</option><option value="9">12</option></select></label>
          <button type="submit" class="primary">🃏 Make flashcards</button>
        </div>
      </form>
      <div id="cards-area" class="scroll"></div>
    </section>

    <footer class="foot">Answers are generated by AI (Mistral) and can be wrong: check them with your course. Don't share personal information.</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
